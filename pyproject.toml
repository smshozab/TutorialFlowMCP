[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tutorialflow"
version = "0.1.0"
description = "Railway-first MCP server for turning screen recordings into narrated tutorials."
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=2.2,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9",
  "Pillow>=10,<12",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "respx>=0.21,<1", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
include = ["tutorialflow*"]

[tool.setuptools.package-data]
tutorialflow = ["brands/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
